<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Электронная лаборатория ВСЭ — Вход</title>
  <style>
    :root { --ink:#17323a; --muted:#668087; --line:#dfe9e9; --page:#f5f9f8; --panel:#fff; --teal:#146c73; --teal-dark:#0d5358; --tint:#eaf6f4; --soft:#f9fcfb; }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at 18% 18%,#dff3f0 0 18%,transparent 34%),radial-gradient(circle at 82% 12%,#eef8f5 0 16%,transparent 31%),linear-gradient(135deg,#f6faf9 0%,#edf6f4 100%);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
    button,input{font:inherit} button{cursor:pointer} button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #75bfc2;outline-offset:2px}
    .login-page{position:relative;min-height:100vh;display:grid;place-items:center;padding:42px 22px}
    .orb{position:absolute;border-radius:999px;background:linear-gradient(135deg,#ffffff90,#c9e8e370);border:1px solid #ffffff9c;box-shadow:0 24px 70px #2b6b6d12;filter:blur(.1px);animation:float 8s ease-in-out infinite}
    .orb.one{width:180px;height:180px;left:max(24px,8vw);top:13vh}.orb.two{width:110px;height:110px;right:10vw;top:18vh;animation-delay:-2.2s}.orb.three{width:135px;height:135px;right:18vw;bottom:12vh;animation-delay:-4.5s}
    .login-shell{position:relative;width:min(1040px,100%);display:grid;grid-template-columns:minmax(0,1.05fr) 430px;gap:26px;align-items:stretch}
    .welcome-panel{min-height:510px;border:1px solid #ffffffaa;border-radius:28px;padding:42px;background:linear-gradient(145deg,#ffffffc9,#eef8f5b8);box-shadow:0 24px 70px #17323a12;backdrop-filter:blur(18px);display:grid;align-content:center;overflow:hidden;position:relative}
    .welcome-panel:after{content:"";position:absolute;width:360px;height:360px;border-radius:50%;right:-150px;bottom:-150px;background:radial-gradient(circle,#d3efea 0,#d3efea00 68%)}
    .brand-mark{position:relative;z-index:1;display:inline-flex;align-items:center;gap:16px;margin-bottom:30px}
    .logo-wrap{width:78px;height:78px;border-radius:22px;display:grid;place-items:center}
    .logo-wrap img{display:block;width:78px;height:78px;aspect-ratio:1 / 1;border-radius:0;object-fit:contain;object-position:center;box-shadow:none}
    .brand-copy strong{display:block;font-size:15px;letter-spacing:-.01em}
    h1{position:relative;z-index:1;margin:0;max-width:620px;font-size:42px;line-height:1.05;letter-spacing:-.045em}.accent{color:var(--teal)}
    .welcome-text{position:relative;z-index:1;max-width:545px;margin:18px 0 0;color:var(--muted);font-size:16px}
    .login-card{min-height:510px;border:1px solid var(--line);border-radius:26px;background:var(--panel);box-shadow:0 24px 64px #17323a18;padding:30px;display:grid;align-content:start;gap:22px;padding-top:94px}
    .login-card h2{margin:0;font-size:24px;letter-spacing:-.03em}.login-card .hint{margin:5px 0 0;color:var(--muted)}
    .form{display:grid;gap:15px}.field{display:grid;gap:7px}.field label{color:var(--muted);font-size:12px;font-weight:760;letter-spacing:.06em;text-transform:uppercase}.field input{width:100%;min-height:48px;border:1px solid #cbdadb;border-radius:13px;padding:0 14px;background:#fbfdfd;color:var(--ink);transition:.16s}.field input:hover{border-color:#b7d4d0}.field input:focus{border-color:#7abfbd;background:#fff;box-shadow:0 0 0 4px #75bfc21c;outline:0}
    .password-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.forgot{color:var(--teal);font-size:12px;font-weight:760;text-decoration:none}.forgot:hover{color:var(--teal-dark);text-decoration:underline}
    .login-button{min-height:50px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--teal),var(--teal-dark));color:#fff;font-weight:600;box-shadow:0 14px 28px #146c7328;transition:.18s;display:inline-flex;align-items:center;justify-content:center;gap:9px}.login-button:hover{transform:translateY(-1px);box-shadow:0 18px 34px #146c7333}.login-button svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .toast{position:fixed;right:24px;bottom:24px;background:#173f43;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 12px 28px #16333735;transform:translateY(12px);opacity:0;pointer-events:none;transition:.2s}.toast.show{transform:none;opacity:1}
    @keyframes float{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-16px,0)}}
    @media(prefers-reduced-motion:reduce){.orb,.login-button{animation:none;transition:none}.login-button:hover{transform:none}}
    @media(max-width:900px){.login-shell{grid-template-columns:1fr}.welcome-panel,.login-card{min-height:auto}.login-card{max-width:520px;width:100%;justify-self:center;padding-top:30px}h1{font-size:34px}}
    @media(max-width:560px){.login-page{padding:18px}.welcome-panel,.login-card{border-radius:20px;padding:22px}.brand-mark{align-items:flex-start}.logo-wrap,.logo-wrap img{width:62px;height:62px;border-radius:0}h1{font-size:28px}.welcome-text{font-size:14px}.orb{display:none}}
  </style>
  <link rel="preload" as="image" href="vse-lab-icon-transparent.png" fetchpriority="high">
  <link rel="stylesheet" href="app-shell.css">
</head>
<body>
  <main class="login-page">
    <span class="orb one" aria-hidden="true"></span>
    <span class="orb two" aria-hidden="true"></span>
    <span class="orb three" aria-hidden="true"></span>
    <section class="login-shell" aria-label="Экран входа">
      <div class="welcome-panel">
        <div class="brand-mark">
          <div class="logo-wrap"><img src="vse-lab-icon-transparent.png" alt="" width="78" height="78" loading="eager" decoding="sync" fetchpriority="high"></div>
          <div class="brand-copy"><strong>Электронная лаборатория ВСЭ</strong></div>
        </div>
        <h1>Добро пожаловать в систему <span class="accent">«Электронная лаборатория ВСЭ»</span></h1>
        <p class="welcome-text">Единая система для работы лабораторий: прием партий продукции, учет данных ветеринарно-санитарных экспертиз.</p>
      </div>
      <form class="login-card" id="login-form">
        <div>
          <h2>Вход в систему</h2>
          <p class="hint">Введите логин и пароль пользователя</p>
        </div>
        <div class="form">
          <div class="field"><label for="login">Логин</label><input id="login" name="login" type="text" autocomplete="username" placeholder="Например, Kuznetsova.Anna@tatar.ru" required></div>
          <div class="field"><div class="password-row"><label for="password">Пароль</label><a class="forgot" href="password-recovery.html">Забыли пароль?</a></div><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Введите пароль" required></div>
          <button class="login-button" type="submit">Войти <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></button>
        </div>
      </form>
    </section>
  </main>
  <div class="toast" role="status" aria-live="polite" id="toast"></div>
  <script>
    const toast=document.getElementById('toast');function notice(message){toast.textContent=message;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}
    document.getElementById('login-form').addEventListener('submit',(event)=>{event.preventDefault();window.location.href='journal.html'});
  </script>
</body>
</html>
