<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Восстановление пароля — Электронная лаборатория ВСЭ</title>
  <link rel="stylesheet" href="app-shell.css">
  <link rel="stylesheet" href="password-recovery.css">
  <script src="password-recovery.js" defer></script>
</head>
<body>
  <main class="recovery-page">
    <span class="orb one" aria-hidden="true"></span>
    <span class="orb two" aria-hidden="true"></span>
    <span class="orb three" aria-hidden="true"></span>
    <section class="recovery-card" aria-labelledby="recovery-title">
      <h1 id="recovery-title">Восстановление пароля</h1>
      <p class="recovery-description">Отправим ссылку для восстановления на почту, указанную при регистрации.</p>
      <form id="recovery-form" novalidate>
        <div class="recovery-field">
          <label for="recovery-email">Электронная почта</label>
          <input id="recovery-email" name="email" type="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" required aria-describedby="recovery-error">
          <p class="recovery-error" id="recovery-error" aria-live="polite"></p>
        </div>
        <button class="recovery-submit" id="recovery-submit" type="submit">Восстановить пароль</button>
      </form>
      <a class="recovery-back" href="login.html" data-clear-recovery><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"></path></svg>Вернуться ко входу</a>
    </section>
  </main>
</body>
</html>
