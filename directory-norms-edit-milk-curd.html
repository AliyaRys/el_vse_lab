<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Электронная лаборатория ВСЭ — Нормы исследований молока</title>
  <style>
    :root { --ink:#17323a; --muted:#668087; --line:#dfe9e9; --page:#f5f9f8; --panel:#fff; --teal:#146c73; --teal-dark:#0d5358; --tint:#eaf6f4; --danger:#a33943; }
    *{box-sizing:border-box} body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    button,input,select,textarea{font:inherit} button{cursor:pointer} button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #75bfc2;outline-offset:2px}
    .topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 max(24px,calc((100vw - 1440px)/2));gap:26px;position:sticky;top:0;z-index:10}
    .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);min-width:275px}.brand strong{display:block;font-size:15px;letter-spacing:-.01em}.brand span{display:block;color:var(--muted);font-size:12px;margin-top:1px}
    .topnav{display:flex;align-items:center;gap:6px;flex:1}.navlink,.user-link{border:0;background:transparent;color:#4c6870;min-height:42px;border-radius:10px;text-decoration:none;display:inline-flex;align-items:center;gap:9px;padding:0 12px;font-weight:600}.navlink:hover,.user-link:hover,.navlink.active{background:var(--tint);color:var(--teal-dark)}.navlink{border:1px solid var(--line);background:#fff}.navlink.active{border-color:#c9e6e2;box-shadow:inset 0 0 0 1px #c9e6e2}.icon{width:19px;height:19px;display:inline-grid;place-items:center;font-size:18px;line-height:1}.user-area{display:flex;align-items:center;gap:5px}.avatar{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#d7efec;color:var(--teal-dark);font-weight:750;font-size:12px}.logout{border:1px solid var(--line);background:white;color:#587077;border-radius:9px;min-height:38px;padding:0 12px;font-weight:650}.logout:hover{border-color:#e7b7bc;color:var(--danger);background:#fff8f8}
    .nav-item{position:relative;width:340px}.nav-item>.navlink{width:100%;justify-content:flex-start}.nav-item .navtext{margin-right:auto}.nav-item:hover>.navlink,.nav-item:focus-within>.navlink{background:var(--tint);color:var(--teal-dark)}.nav-caret{width:14px;height:14px;margin-left:auto;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.journal-menu{position:absolute;left:0;top:calc(100% - 1px);z-index:30;display:none;width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 18px 42px #17323a22}.nav-item:hover .journal-menu,.nav-item:focus-within .journal-menu,.nav-item.open .journal-menu{display:grid}.journal-menu a{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:38px;border-radius:10px;padding:0 10px;text-decoration:none;color:#4d676d;font-weight:620;line-height:1.2}.journal-menu a:hover{background:#f5f9f8;color:var(--teal-dark)}.journal-menu a.active{background:var(--tint);color:var(--teal-dark);font-weight:720;box-shadow:inset 0 0 0 1px #c9e6e2}.journal-menu a.active::after{content:"✓";font-weight:900;color:var(--teal)}
    main{max-width:1180px;margin:0 auto;padding:37px 24px 96px}.title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px}.eyebrow{color:var(--teal);font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;margin:0 0 6px}.title-row h1{font-size:30px;line-height:1.15;letter-spacing:-.035em;margin:0}.title-row p{margin:8px 0 0;color:var(--muted)}
    form{display:grid;gap:18px}.section{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:25px;box-shadow:0 8px 24px #1f5a5b08}.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:21px}.section-title{display:flex;gap:12px;align-items:center}.section-icon{display:inline-flex;align-items:center;justify-content:center;width:37px;height:37px;min-width:37px;border-radius:11px;background:var(--tint);color:var(--teal);font-size:18px;line-height:1}.section-icon svg{display:block;width:20px;height:20px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}.section h2{margin:0;font-size:17px;letter-spacing:-.015em}.section-head p{margin:3px 0 0;color:var(--muted);font-size:13px}
    .norm-list{display:grid;gap:12px}.norm-row{display:grid;grid-template-columns:minmax(260px,1fr) 180px 180px;gap:12px;align-items:end;border:1px solid var(--line);border-radius:13px;background:#fff;padding:16px}.norm-name{font-weight:760;font-size:15px}.norm-meta{color:var(--muted);font-size:12px;margin-top:2px}.field{display:grid;gap:7px}.field label{color:var(--muted);font-size:11px;font-weight:760;letter-spacing:.06em;text-transform:uppercase}.field input,.field select{width:100%;min-height:43px;border:1px solid #cbdadb;border-radius:9px;padding:0 12px;background:#fff;color:var(--ink);transition:border .15s,box-shadow .15s}.field select{appearance:none;padding-right:38px;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 20 20' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M5.5 7.5 10 12l4.5-4.5z' fill='%23668087'/%3E%3C/svg%3E");background-position:calc(100% - 15px) center;background-size:16px 16px;background-repeat:no-repeat}.field input:hover,.field select:hover{border-color:#a6c4c5}.field input:focus,.field select:focus{border-color:var(--teal);box-shadow:0 0 0 3px #1b8b9130;outline:none}.unit{position:relative}.unit input{padding-right:84px}.unit span{position:absolute;right:12px;bottom:11px;color:var(--muted);font-weight:760;font-size:12px}.boil-norm-row{display:block}.boil-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:13px}.boil-head h2{margin:0;font-size:17px;letter-spacing:-.015em}.boil-head p{margin:3px 0 0;color:var(--muted);font-size:13px}.boil-list{display:grid;gap:9px}.boil-row{display:grid;grid-template-columns:minmax(260px,1fr) 170px 43px;gap:10px;align-items:end;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px}.remove-row,.add-row-button{display:inline-grid;place-items:center;width:43px;height:43px;min-height:43px;border:1px solid #cbdadb;background:#fff;color:#4d676d;border-radius:9px;font-size:20px;font-weight:760;line-height:1;padding:0;flex:0 0 auto}.remove-row:hover,.add-row-button:hover{background:var(--tint);border-color:#9cc4c2;color:var(--teal-dark)}
    .actions{position:sticky;bottom:18px;display:flex;justify-content:flex-end;gap:10px;padding:15px 18px;background:#ffffffed;backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:15px;box-shadow:0 12px 36px #274e501c}.btn{border:1px solid transparent;border-radius:10px;min-height:43px;padding:0 16px;font-weight:720;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.secondary{border-color:#cbdadb;background:#fff;color:#4d676d}.btn.secondary:hover{background:#f5f8f8}.btn.primary{background:var(--teal);color:#fff;box-shadow:0 5px 12px #146c7330}.btn.primary:hover{background:var(--teal-dark)}.toast{position:fixed;right:24px;bottom:87px;background:#173f43;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 12px 28px #16333735;transform:translateY(12px);opacity:0;pointer-events:none;transition:.2s}.toast.show{transform:none;opacity:1}
    .norm-single{grid-column:2/-1}.norm-group{margin-top:24px}.norm-group h3{font-size:15px;margin:0 0 11px}.norm-group .norm-list{gap:12px}.source-note{margin:18px 0 0;color:var(--muted);font-size:12px}.source-note a{color:var(--teal)}
    .field.unavailable input:disabled{background:#eef2f2;border-color:#dce5e5;color:#71858a;opacity:1;cursor:not-allowed}.field.unavailable input:disabled:hover{border-color:#dce5e5}.field.unavailable span{color:#9aa9ac}
    @media(max-width:900px){.norm-row{grid-template-columns:1fr 1fr}.norm-info{grid-column:1/-1}.boil-row{grid-template-columns:1fr 150px 43px}}@media(max-width:800px){.topbar{padding:0 15px;gap:8px}.brand{min-width:0}.brand span,.topnav .navtext,.user-link{display:none}.nav-item{width:52px}.nav-item>.navlink{justify-content:center}.nav-caret{display:none}.journal-menu{width:270px}.title-row{align-items:flex-start;flex-direction:column}.section{padding:18px}.norm-row,.boil-row{grid-template-columns:1fr}.norm-single{grid-column:1/-1}.boil-head{align-items:stretch;flex-direction:column}.logout{padding:0 9px}.actions{bottom:8px;gap:7px;padding:11px}.btn{padding:0 11px}.remove-row,.add-row-button{width:100%}}
  </style>
  <link rel="preload" as="image" href="vse-lab-icon-transparent.png" fetchpriority="high">
  <link rel="stylesheet" href="app-shell.css">
  <script src="components/shell/AppHeader.js?v=20261020-1" defer></script>
  <script src="app-shell.js" defer></script>

  <script src="milk-norms-data.js" defer></script>
  <script src="milk-norms.js" defer></script>
</head>
<body data-norm-product="curd">
  <header class="topbar">
    <a class="brand" href="journal.html" id="brand-home" aria-label="Электронная лаборатория ВСЭ — главная"><img src="vse-lab-icon-transparent.png" alt="" width="43" height="43" loading="eager" decoding="sync" fetchpriority="high"><div><strong>Электронная лаборатория ВСЭ</strong><span>Лаборатория ВСЭ №1 г. Казань</span></div></a>
    <nav class="topnav" aria-label="Основная навигация">
      <a class="navlink" href="arrivals.html" id="arrivals-link"><span class="icon"><svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 8.2 12 4l7.5 4.2-7.5 4.2-7.5-4.2Z"/><path d="M4.5 8.2v7.9L12 20l7.5-3.9V8.2"/><path d="M12 12.4V20"/></svg></span><span class="navtext">Поступления</span></a>
      <a class="navlink" href="journal.html" id="journal-home"><span class="icon" aria-hidden="true">▦</span><span class="navtext">Журнал ВСЭ</span></a>
      <a class="navlink active" href="directories.html" id="directories" aria-current="page"><span class="icon" aria-hidden="true">⚙</span><span class="navtext">Справочники</span></a>
      <div class="nav-item product-switcher">
        <button class="navlink product-trigger" id="product-switcher" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Тип продукции: Молоко и молочная продукция" data-short-label="Молоко"><span class="navtext" data-product-label>Молоко и молочная продукция</span><svg class="nav-caret" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></button>
        <div class="journal-menu product-menu" role="listbox" aria-label="Тип продукции">
          <button type="button" role="option" aria-selected="false" data-product-option="meat">Мясо и продукты убоя</button>
          <button class="active" type="button" role="option" aria-selected="true" data-product-option="milk">Молоко и молочная продукция</button>
        </div>
      </div>
    </nav>
    <div class="user-area"><a class="user-link" href="profile.html" id="profile"><span class="avatar">АК</span><span>Анна Кузнецова</span></a><button class="logout" type="button" id="logout">Выйти</button></div>
  </header>
  <main>
    <div class="norms-layout">
      <aside class="catalog-rail" id="milk-norms-rail" aria-label="Виды молочной продукции">
        <div class="catalog-heading">Вид продукции</div>
        <button class="catalog-toggle" id="milk-norms-toggle" type="button" aria-expanded="false" aria-controls="milk-norms-nav"><span>Вид продукции</span></button>
        <nav class="catalog-links" id="milk-norms-nav" aria-label="Страницы норм исследований"></nav>
      </aside>
      <div class="catalog-content">
        <div class="title-row"><div><h1 id="norms-product-title">Нормы исследований</h1></div></div>
        <form id="norms-directory-form" novalidate>
          <p class="norms-error" id="norms-error" role="alert" aria-live="assertive"></p>
          <div class="actions"><a class="btn secondary" href="directories.html">Отменить</a><button class="btn primary" type="submit">Сохранить справочник</button></div>
        </form>
      </div>
    </div>
  </main>
  <div class="toast" role="status" aria-live="polite" id="toast"></div>
  <script>document.getElementById('logout').addEventListener('click',()=>{window.location.href='login.html'});</script>
</body>
</html>
